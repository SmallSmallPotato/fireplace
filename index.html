*{box-sizing:border-box;margin:0;padding:0}

#scene{image-rendering:pixelated;-webkit-mask-image:radial-gradient(ellipse 82% 86% at 50% 54%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 82% 86% at 50% 54%,#000 70%,transparent 100%)}

.btn:active{transform:translate(2px,2px)}

<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <div id="glow"></div><div id="vig"></div>
  <canvas id="fx"></canvas>
</div>
<button id="soundBtn" class="btn" type="button">🔈 輕觸畫面開啟柴火聲</button>
<button id="weatherBtn" class="btn" type="button">❄️ 窗外雪景：微雪</button>
<div id="hint">🔥 點擊壁爐迸出火星 · 輕觸任何位置即可開啟柴火聲</div>

<script>
/* ============ 1. 柴火聲（Web Audio 合成：火吼 + 呼吸 + 成簇噼啪 + 木柴爆裂 + 小房間回響） ============ */
class FireSound{
  constructor(){this.ctx=null;this.muted=false;this.onPop=null;this.vol=.9;this.inten=1}
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=this.ctx=new AC();
    this.master=c.createGain();this.master.gain.value=this.vol;
    const comp=c.createDynamicsCompressor();comp.threshold.value=-22;comp.ratio.value=3.5;comp.attack.value=.004;comp.release.value=.25;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;lp.Q.value=.3;
    const conv=c.createConvolver();conv.buffer=this.ir(1.3);
    const wet=c.createGain();wet.gain.value=.2;
    this.bus=c.createGain();
    this.bus.connect(lp);this.bus.connect(conv);conv.connect(wet);wet.connect(lp);
    lp.connect(this.master);this.master.connect(comp);comp.connect(c.destination);
    this.white=this.noise('white',4);
    const brown=this.noise('brown',10),pink=this.noise('pink',8);
    this.layers=[
      this.bed(brown,'lowpass',150,.6,.5,.10,0),
      this.bed(brown,'bandpass',330,.8,.18,.16,0),
      this.bed(pink,'bandpass',720,.7,.07,.28,-.3),
      this.bed(pink,'bandpass',1500,.9,.04,.30,.3),
      this.bed(this.crackleBuf(4.1,90),'highpass',1800,.6,.28,.2,-.5),
      this.bed(this.crackleBuf(5.7,55),'bandpass',3400,1,.24,.2,.5),
      this.bed(this.white,'highpass',6500,.5,.012,.1,0)
    ];
    setInterval(()=>this.modulate(),100);
    this.loop();
  }
  ir(sec){
    const c=this.ctx,n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/n*5.5)*(1-Math.exp(-i/(c.sampleRate*.006)))}
    return b;
  }
  noise(type,sec){
    const c=this.ctx,n=c.sampleRate*sec,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    let l=0,b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<n;i++){
      const w=Math.random()*2-1;
      if(type==='white')d[i]=w;
      else if(type==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}
      else{b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
    }
    return b;
  }
  crackleBuf(sec,rate){
    const c=this.ctx,sr=c.sampleRate,n=sr*sec,b=c.createBuffer(1,n,sr),d=b.getChannelData(0);
    let t=0;
    while(t<n){
      t+=-Math.log(1-Math.random())/rate*sr;
      if(Math.random()<.25)t+=sr*.004*Math.random();
      const len=(.0008+Math.random()*.004)*sr,amp=Math.pow(Math.random(),3);
      for(let j=0;j<len&&t+j<n;j++)d[Math.floor(t+j)]+=(Math.random()*2-1)*amp*Math.exp(-j/len*4);
    }
    return b;
  }
  route(node,pan){
    const c=this.ctx;
    if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=pan;node.connect(p);p.connect(this.bus)}else node.connect(this.bus);
  }
  bed(buf,type,freq,q,base,step,pan){
    const c=this.ctx,s=c.createBufferSource();s.buffer=buf;s.loop=true;
    const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
    const g=c.createGain();g.gain.value=base;
    s.connect(f);f.connect(g);this.route(g,pan);s.start(0,Math.random()*buf.duration);
    return{g,base,step,val:.5};
  }
  modulate(){
    const c=this.ctx;if(!c||c.state!=='running')return;
    this.inten=Math.max(.6,Math.min(1.5,this.inten+(Math.random()-.5)*.14));
    this.layers.forEach((L,i)=>{
      L.val=Math.max(0,Math.min(1,L.val+(Math.random()-.5)*L.step*2));
      const k=i<2?Math.pow(this.inten,1.5):.8+.2*this.inten;
      L.g.gain.setTargetAtTime(L.base*(.6+.8*L.val)*k,c.currentTime,.25);
    });
  }
  tick(t,amp,freq,q,dur,pan){
    const c=this.ctx,s=c.createBufferSource();s.buffer=this.white;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
    const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(amp,t+.0004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);this.route(g,pan);s.start(t,Math.random()*3.5);s.stop(t+dur+.02);
  }
  tone(t,amp,freq,dur,drop,pan){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*drop,t+dur);
    g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);this.route(g,pan);o.start(t);o.stop(t+dur+.02);
  }
  hiss(t,amp,dur,pan){
    const c=this.ctx,s=c.createBufferSource();s.buffer=this.white;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=4200;f.Q.value=.6;
    const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(amp,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);this.route(g,pan);s.start(t,Math.random()*3);s.stop(t+dur+.02);
  }
  snap(t,a,pan){
    const n=1+Math.floor(Math.random()*6);let tt=t;
    for(let i=0;i<n;i++){
      this.tick(tt,a*(1-i*.1)*(.4+Math.random()*.6),1400+Math.random()*4200,.8+Math.random()*2.2,.002+Math.random()*.012,pan);
      tt+=.002+Math.random()*.02;
    }
    if(Math.random()<.3)this.tone(t+.001,a*.28,220+Math.random()*420,.03+Math.random()*.03,.6,pan);
  }
  pop(t,a,pan,big){
    this.tone(t,a*(big?.5:.3),(big?75:95)+Math.random()*50,.14,.45,pan);
    this.tick(t,a*1.2,1800+Math.random()*1800,.7,.04,pan);
    this.tick(t+.012,a*.7,700+Math.random()*500,.9,.05,pan);
    this.tone(t+.004,a*.3,260+Math.random()*180,.06,.6,pan);
    this.snap(t+.03,a*.5,pan);
    this.hiss(t+.015,a*(big?.16:.09),.18+Math.random()*.18,pan);
    this.onPop&&this.onPop(big?1:.45);
  }
  event(force){
    const c=this.ctx;
    if(!c||c.state!=='running'||this.muted||document.hidden)return;
    const t=c.currentTime+.01,pan=Math.random()*1.4-.7,r=Math.random()*this.inten;
    if(force){this.pop(t,1.5,pan,true);return}
    if(r<.72)this.snap(t,.5+Math.random()*.6,pan);
    else if(r<.95){this.snap(t,.7+Math.random()*.5,pan);this.snap(t+.03+Math.random()*.05,.5,pan);if(Math.random()<.5)this.snap(t+.09+Math.random()*.08,.4,pan)}
    else if(r<1.28)this.pop(t,.9+Math.random()*.4,pan,false);
    else this.pop(t,1.4+Math.random()*.4,pan,true);
  }
  loop(){
    this.event();
    setTimeout(()=>this.loop(),Math.min(1100,Math.max(30,-Math.log(1-Math.random())*(240/this.inten))));
  }
  unlock(){
    const c=this.ctx;
    if(!c||c.state==='running')return Promise.resolve();
    return c.resume().catch(()=>{});
  }
  toggle(){
    const c=this.ctx;if(!c)return Promise.resolve();
    if(c.state!=='running'){this.muted=false;this.master.gain.setTargetAtTime(this.vol,c.currentTime,.05);return this.unlock()}
    this.muted=!this.muted;
    this.master.gain.setTargetAtTime(this.muted?0:this.vol,c.currentTime,.08);
    return Promise.resolve();
  }
}
const fireAudio=new FireSound();

/* ============ 2. 像素場景 ============ */
const PX_W=320,PX_H=200;
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');cv.width=PX_W;cv.height=PX_H;
const fx=document.getElementById('fx'),fc=fx.getContext('2d');
const st=document.createElement('canvas');st.width=PX_W;st.height=PX_H;const bg=st.getContext('2d');
const fl=document.createElement('canvas');fl.width=PX_W;fl.height=PX_H;const fg=fl.getContext('2d'); // 火前方的柴

function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function disc(c,cx,cy,r,col){for(let dy=-r;dy<=r;dy++){const hw=Math.floor(Math.sqrt(r*r-dy*dy+.5));R(c,cx-hw,cy+dy,hw*2+1,1,col)}}
function ell(c,cx,cy,rx,ry,col){for(let dy=-ry;dy<=ry;dy++){const hw=Math.round(rx*Math.sqrt(1-dy*dy/(ry*ry)));R(c,cx-hw,cy+dy,hw*2,1,col)}}
function archRows(c,cx,cy,r,bottom,col){for(let y=cy-r;y<bottom;y++){const hw=y<cy?Math.round(Math.sqrt(r*r-(cy-y)*(cy-y))):r;R(c,cx-hw,y,hw*2,1,typeof col==='function'?col(y):col)}}
function archP(cx,cy,r,bottom){const p=new Path2D();p.moveTo(cx-r,cy);p.arc(cx,cy,r,Math.PI,0);p.lineTo(cx+r,bottom);p.lineTo(cx-r,bottom);p.closePath();return p}
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function lerpC(a,b,t){const A=hx(a),B=hx(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function hash(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
let seed=7;function rnd(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}

const BP=['#8b4a33','#7d3f2c','#9a553b','#6e3524','#a45f42'];
function bricks(c,x0,y0,w,h,bh,bw,pal,mortar){
  R(c,x0,y0,w,h,mortar);
  for(let r=0,y=y0;y<y0+h;y+=bh,r++){
    const off=(r&1)?-(bw>>1):0;
    for(let x=x0+off;x<x0+w;x+=bw){
      const bx=Math.max(x,x0),wd=Math.min(x+bw,x0+w)-bx-1,hh=Math.min(bh,y0+h-y)-1;
      if(wd<=0||hh<=0)continue;
      R(c,bx,y,wd,hh,pal[Math.floor(hash(x,y)*pal.length)]);
      R(c,bx,y,wd,1,'rgba(255,210,160,.2)');R(c,bx,y+hh-1,wd,1,'rgba(0,0,0,.22)');
    }
  }
}
function log(c,x0,y0,x1,y1,th){
  for(let x=x0;x<=x1;x++){
    const y=y0+(y1-y0)*(x-x0)/(x1-x0);
    R(c,x,y-th/2,1,th,'#3b2314');R(c,x,y-th/2,1,2,'#6a4426');R(c,x,y+th/2-1,1,1,'#180b05');
    if(hash(x,3)>.7)R(c,x,y-th/2+2,1,2,'#2a190d');
    if(hash(x,8)>.88)R(c,x,y-1,1,1,'#1e100a');
  }
  [[x0,y0],[x1,y1]].forEach(([x,y])=>{disc(c,x,Math.round(y),th/2,'#c79a62');disc(c,x,Math.round(y),th/2-2,'#a77a45');disc(c,x,Math.round(y),1,'#6a4426')});
}

/* 窗（只保留一扇，位於右側） */
function win(cx){
  archRows(bg,cx,58,25,104,'#d8c29c');
  archRows(bg,cx,58,22,104,y=>lerpC('#0b1a33','#2b4c68',(y-36)/68));
  for(let i=0;i<14;i++){const x=cx-18+Math.floor(rnd()*36),y=40+Math.floor(rnd()*26);if(Math.abs(x-cx)<Math.sqrt(Math.max(0,484-Math.pow(Math.max(0,58-y),2)))-1)R(bg,x,y,1,1,'#cfe0ff')}
  disc(bg,cx+9,52,5,'#f6f0d2');disc(bg,cx+11,50,4,'#14294a');
  for(let y=88;y<104;y++)R(bg,cx-22,y,44,1,lerpC('#2a4560','#1c3248',(y-88)/16));
  [[-11,80,15],[11,84,12],[-1,88,9]].forEach(([dx,y,h])=>{for(let r=0;r<h;r++){const w=1+Math.floor(r*.55);R(bg,cx+dx-w,y+r,w*2+1,1,'#0e2034');if(r%3===0)R(bg,cx+dx-w,y+r,1,1,'#9fb7cf')}});
  for(let y=97;y<104;y++)R(bg,cx-22,y,44,1,lerpC('#c4d6e8','#9db4cc',(y-97)/7));
  R(bg,cx-1,36,3,68,'#d8c29c');R(bg,cx-22,80,44,3,'#d8c29c');R(bg,cx,36,1,68,'#efe0c0');R(bg,cx-22,80,44,1,'#efe0c0');
  R(bg,cx-27,104,54,4,'#cdb48c');R(bg,cx-27,104,54,1,'#ecdcb8');R(bg,cx-27,108,54,2,'#3a2113');
  [-1,1].forEach(s=>{
    for(let y=30;y<112;y++){
      const w=Math.round(10-3.5*Math.exp(-Math.pow((y-84)/7,2))-(y>100?(y-100)*.15:0));
      for(let i=0;i<w;i++)R(bg,s<0?cx-33+i:cx+32-i,y,1,1,(i%4<2)?'#c77a3a':'#a9602c');
    }
    R(bg,s<0?cx-33:cx+25,83,8,2,'#e9c27a');
  });
  R(bg,cx-38,27,76,2,'#2e170d');R(bg,cx-38,27,76,1,'#6a4026');disc(bg,cx-38,28,2,'#d9a84a');disc(bg,cx+38,28,2,'#d9a84a');
}

function leg(c,x0,y0,x1,y1,w0,w1,col,hl){for(let y=y0;y<=y1;y++){const t=(y-y0)/(y1-y0),x=x0+(x1-x0)*t,w=Math.round(w0+(w1-w0)*t);R(c,x-w/2,y,w,1,col);R(c,x-w/2,y,1,1,hl)}}
/* 窗下掛牆桌（復古雕飾托架＋黃銅球）＋熱咖啡 */
const CUPX=268,CUPY=117;
function wallTable(){
  const x0=248,w=56;
  R(bg,x0+2,138,w-4,4,'rgba(0,0,0,.28)');R(bg,x0+4,142,w-8,3,'rgba(0,0,0,.14)');
  [x0+5,x0+w-8].forEach(x=>{
    R(bg,x,136,3,19,'#4a2a14');R(bg,x,136,1,19,'#6a4026');R(bg,x-1,153,5,2,'#6a4026');
    disc(bg,x+1,158,2,'#c9953a');R(bg,x,157,1,1,'#f0d48a');
  });
  R(bg,x0+2,133,w-4,5,'#6a4026');R(bg,x0+2,133,w-4,1,'#8a5430');R(bg,x0+4,135,w-8,1,'#b07a46');
  for(let x=x0+4;x<x0+w-4;x+=6){R(bg,x,138,4,1,'#4a2a14');R(bg,x+1,139,2,1,'#4a2a14')}
  R(bg,x0,127,w,3,'#a8703f');R(bg,x0,127,w,1,'#c9965e');
  R(bg,x0-1,130,w+2,3,'#7a4a28');R(bg,x0-1,130,w+2,1,'#9a6236');R(bg,x0-1,132,w+2,1,'#3a2010');
  R(bg,x0+38,123,15,4,'#8a2f23');R(bg,x0+38,125,15,1,'#e8dcc4');R(bg,x0+40,119,12,4,'#3f6b5a');R(bg,x0+40,121,12,1,'#e8dcc4');
  ell(bg,CUPX,127,10,2,'#cdbf9f');ell(bg,CUPX,126,9,2,'#e8dcc4');ell(bg,CUPX,126,6,1,'#f6efdf');R(bg,CUPX-10,126,5,1,'#b9b2a6');
  R(bg,CUPX-5,118,10,8,'#f4ebd8');R(bg,CUPX-5,118,2,8,'#fff7e6');R(bg,CUPX+3,118,2,8,'#d7c6a6');R(bg,CUPX-5,122,10,1,'#b5533c');R(bg,CUPX-4,126,8,1,'#d7c6a6');
  R(bg,CUPX+5,120,3,1,'#f4ebd8');R(bg,CUPX+7,121,1,3,'#f4ebd8');R(bg,CUPX+5,124,3,1,'#d7c6a6');
  ell(bg,CUPX,118,5,2,'#fff7e6');ell(bg,CUPX,118,4,1,'#3b1d0e');R(bg,CUPX-2,118,2,1,'#7a4a2a');R(bg,CUPX+1,117,1,1,'#b88a5a');
}
/* 復古高腳椅：稍為拉離桌邊，椅背搭著剛脫下的毛毯 */
function chair(){
  const cx=232;
  ell(bg,cx+4,189,21,3,'rgba(0,0,0,.38)');
  R(bg,cx-9,110,3,78,'#3a2010');R(bg,cx+8,110,3,78,'#3a2010');R(bg,cx-9,110,1,78,'#5a3418');R(bg,cx+8,110,1,78,'#5a3418');
  disc(bg,cx-8,108,2,'#c9953a');disc(bg,cx+9,108,2,'#c9953a');
  R(bg,cx-9,112,20,3,'#5a3418');R(bg,cx-9,112,20,1,'#7a4a28');R(bg,cx-9,129,20,2,'#5a3418');
  [-5,-1,3,7].forEach(d=>R(bg,cx+d,115,1,14,'#4a2a14'));

const FW=70,FH=64,heat=new Float32Array(FW*FH),fcv=document.createElement('canvas');fcv.width=FW;fcv.height=FH;

const LUT=new Uint8ClampedArray(256*4);
(function(){
  const S=[[0,0,0,0,0],[.07,120,20,8,0],[.15,170,28,10,140],[.28,225,60,14,215],[.45,255,115,24,240],[.62,255,170,50,250],[.78,255,215,100,255],[.92,255,240,170,255],[1,255,250,215,255]];
  for(let i=0;i<256;i++){
    const v=i/255;let k=0;while(k<S.length-2&&v>S[k+1][0])k++;
    const a=S[k],b=S[k+1],t=Math.max(0,Math.min(1,(v-a[0])/(b[0]-a[0])));
    for(let j=0;j<4;j++)LUT[i*4+j]=a[j+1]+(b[j+1]-a[j+1])*t;
  }
})();
let flick=.85,boost=0,lastStep=0;
function stepFire(t){
  const T=t*.001,F=Math.min(1.25,flick+.2+boost*.5);
  for(let x=0;x<FW;x++){
    const nx=(x-(FW-1)/2)/(FW/2);
    const base=Math.pow(Math.max(0,1-Math.abs(nx)*.95),.6);
    let tg=0;
    for(let k=0;k<5;k++){const cc=Math.sin(T*(.9+k*.37)+k*2.3)*.5+(k-2)*.26,d=(nx-cc)/.17;tg+=Math.exp(-d*d)}
    const v=base*(.5+.4*Math.min(1,tg)+.22*Math.random())*F;
    heat[(FH-1)*FW+x]=v;heat[(FH-2)*FW+x]=Math.max(heat[(FH-2)*FW+x],v*.92);
  }
  for(let y=0;y<FH-2;y++){
    const up=(FH-y)/FH,b=(y+1)*FW,b2=(y+2)*FW;
    for(let x=0;x<FW;x++){
      const sw=Math.round((Math.sin(T*2.3+x*.21+y*.09)+Math.sin(T*3.7-y*.17+x*.05))*.55*(.6+up));
      const sx=Math.max(1,Math.min(FW-2,x+sw)),e=Math.abs(x-(FW-1)/2)/(FW/2);
      const v=(heat[b+sx-1]+heat[b+sx]*2+heat[b+sx+1]+heat[b2+sx]*.9)/4.9;
      heat[y*FW+x]=Math.max(0,v-(.009+Math.random()*.015+e*e*.03*(1+up)));
    }
  }
  const d=img.data;
  for(let i=0;i<FW*FH;i++){
    const idx=Math.max(0,Math.min(255,Math.round((heat[i]+(Math.random()-.5)*.05)*255)))*4,o=i*4;
    d[o]=LUT[idx];d[o+1]=LUT[idx+1];d[o+2]=LUT[idx+2];d[o+3]=LUT[idx+3];
  }
  fcx.putImageData(img,0,0);
}

  for(let i=0;i<n;i++){const s=flakes[i];ctx.globalAlpha=.6+.4*s.a;ctx.fillRect(Math.round(250+s.x*44),Math.round(30+s.y*68),s.z,s.z)}
  ctx.restore();ctx.globalAlpha=1;
  // 蠟燭、彩燈、咖啡蒸氣
  flame(96,31,t);flame(224,35,t);
  const lc=['#ffd36b','#ff8a5c','#fff1b0','#ff6b6b'];
  wreathLights.forEach(([x,y],i)=>R(ctx,x,y,1,1,Math.sin(t*.004+i*2.1)>0?lc[i%4]:'#6b4a2a'));
  bulbs.forEach(([x,y],i)=>R(ctx,x,y,2,2,Math.sin(t*.003+i*1.7)>-.2?lc[i%4]:'#6b4a2a'));
  steam(t);clockHands();houseGlow(t);sleepCat(t);
  // 爐火
  ctx.save();ctx.clip(archP(160,112,38,170));
  ctx.globalCompositeOperation='lighter';
  let g=ctx.createRadialGradient(160,150,4,160,150,62);g.addColorStop(0,'rgba(255,140,40,'+.6*f+')');g.addColorStop(1,'rgba(255,60,10,0)');
  ctx.fillStyle=g;ctx.fillRect(120,70,80,102);
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(fcv,125,95);
  ctx.drawImage(fl,0,0);
  // 木柴上的炭火餘燼
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<32;i++){const k=Math.floor(t/150)+i*7,hh=hash(i,k),x=134+Math.floor(hash(i,1)*52),y=151+Math.floor(hash(i,2)*14);R(ctx,x,y,2,1,'rgba(255,'+(90+Math.floor(hh*90))+',20,'+((.25+.45*hh)*f).toFixed(3)+')')}
  g=ctx.createLinearGradient(0,157,0,169);g.addColorStop(0,'rgba(255,120,30,'+.22*f+')');g.addColorStop(1,'rgba(255,60,10,0)');ctx.fillStyle=g;ctx.fillRect(126,157,68,12);
  ctx.restore();
  // 室內暖光
  ctx.globalCompositeOperation='lighter';
  g=ctx.createRadialGradient(160,138,8,160,138,200);g.addColorStop(0,'rgba(255,150,60,'+.32*f+')');g.addColorStop(.4,'rgba(255,100,30,'+.14*f+')');g.addColorStop(1,'rgba(255,60,10,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,PX_W,PX_H);
  ctx.save();ctx.translate(160,184);ctx.scale(1,.3);
  g=ctx.createRadialGradient(0,0,4,0,0,115);g.addColorStop(0,'rgba(255,130,40,'+.4*f+')');g.addColorStop(1,'rgba(255,80,20,0)');
  ctx.fillStyle=g;ctx.fillRect(-120,-120,240,240);ctx.restore();
  // 書架、椅子與窗邊小桌受火光
  [[60,130,56,.14],[238,150,46,.16],[268,128,34,.1],[49,112,18,.24],[124,40,14,.22],[138,188,50,.12]].forEach(([x,y,r,al])=>{g=ctx.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,'rgba(255,150,60,'+al*f+')');g.addColorStop(1,'rgba(255,100,30,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)});
  [[96,31],[224,35]].forEach(([x,y])=>{g=ctx.createRadialGradient(x,y,1,x,y,14);g.addColorStop(0,'rgba(255,190,90,.3)');g.addColorStop(1,'rgba(255,150,50,0)');ctx.fillStyle=g;ctx.fillRect(x-14,y-14,28,28)});
  ctx.globalCompositeOperation='source-over';
}

/* ============ 3. 火星與塵埃（全螢幕特效層） ============ */
let embers=[];
const dust=[...Array(28)].map(()=>({x:Math.random(),y:Math.random(),vy:.01+Math.random()*.02,a:.1+Math.random()*.25,s:Math.random()*6.28}));
function spawn(n){
  const r=cv.getBoundingClientRect(),k=r.width/PX_W;
  for(let i=0;i<n;i++)embers.push({x:r.left+(142+Math.random()*36)*k,y:r.top+(118+Math.random()*30)*k,vx:(Math.random()-.5)*12*k,vy:-(28+Math.random()*48)*k,s:Math.max(2,Math.round(k*(.5+Math.random()*.6))),life:1,max:1.3+Math.random()*1.4,col:Math.random()<.6?'#ffcc55':'#ff6a22',ph:Math.random()*6.28});
}
function fxDraw(dt,t){
  fc.clearRect(0,0,fx.width,fx.height);fc.globalCompositeOperation='lighter';
  if(Math.random()<dt*8)spawn(1);
  for(let i=embers.length-1;i>=0;i--){
    const e=embers[i];e.life-=dt/e.max;if(e.life<=0){embers.splice(i,1);continue}
    e.x+=(e.vx+Math.sin(t*.004+e.ph)*10)*dt;e.y+=e.vy*dt;
    fc.fillStyle=e.col;fc.globalAlpha=e.life*.25;fc.fillRect(e.x-e.s,e.y-e.s,e.s*3,e.s*3);
    fc.globalAlpha=e.life;fc.fillRect(e.x,e.y,e.s,e.s);
  }
  fc.fillStyle='#ffd9a0';
  dust.forEach(d=>{d.y-=d.vy*dt;d.s+=dt;if(d.y<0){d.y=1;d.x=Math.random()}fc.globalAlpha=d.a*(.6+.4*Math.sin(d.s*2));fc.fillRect(d.x*fx.width+Math.sin(d.s)*8,d.y*fx.height,2,2)});
  fc.globalAlpha=1;fc.globalCompositeOperation='source-over';
  const m=weather===0?0:weather===1?1:2.8;
  flakes.forEach(s=>{s.y+=s.sp*m*dt*.6;s.sw+=dt*1.2;s.x+=Math.sin(s.sw)*.03*m*dt;if(s.y>1){s.y=0;s.x=Math.random()}});
}

/* 主循環與尺寸 */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  flick=.8+.1*Math.sin(now*.013)+.06*Math.sin(now*.031+2)+.04*Math.sin(now*.071)+boost;boost*=.9;
  if(now-lastStep>36){stepFire(now);lastStep=now}
  scene(now);fxDraw(dt,now);requestAnimationFrame(frame);
}
function resize(){
  const w=innerWidth,h=innerHeight;fx.width=w;fx.height=h;
  const s=Math.min(w/PX_W,h/PX_H)*.98;cv.style.width=Math.round(PX_W*s)+'px';cv.style.height=Math.round(PX_H*s)+'px';
}

/* ============ 4. 互動 ============ */
const soundBtn=document.getElementById('soundBtn'),weatherBtn=document.getElementById('weatherBtn');
function updateSoundBtn(){
  const c=fireAudio.ctx;
  soundBtn.textContent=(!c||c.state!=='running')?'🔈 輕觸畫面開啟柴火聲':fireAudio.muted?'🔇 柴火聲：關':'🔊 柴火聲：開';
}
fireAudio.onPop=s=>{boost=Math.max(boost,.25*s);spawn(Math.round(2+4*s))};
soundBtn.addEventListener('click',e=>{e.stopPropagation();fireAudio.toggle().then(updateSoundBtn);updateSoundBtn()});
weatherBtn.addEventListener('click',e=>{e.stopPropagation();weather=(weather+1)%3;weatherBtn.textContent=wLabels[weather]});
['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,()=>fireAudio.unlock().then(updateSoundBtn),{passive:true}));
document.getElementById('stage').addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  boost=Math.max(boost,.3);spawn(10);
  fireAudio.unlock().then(()=>{fireAudio.event(2);updateSoundBtn()});
});

buildStatic();
resize();addEventListener('resize',resize);
try{fireAudio.init();if(fireAudio.ctx)fireAudio.ctx.onstatechange=updateSoundBtn}catch(e){}
updateSoundBtn();
for(let i=0;i<70;i++)stepFire(i*41);
requestAnimationFrame(frame);
</script>
